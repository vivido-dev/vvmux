[package]
name = "vvmux"
version = "0.4.0"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vivido-dev/vvmux"
description = "A detachable Vivid-aware terminal multiplexer"

[lib]
name = "vvmux_terminal"
path = "vvmux-terminal/src/lib.rs"

[dependencies]
axum = { version = "0.8.4", features = ["ws"], optional = true }
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
futures-util = { version = "0.3", optional = true }
log = "0.4"
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = { version = "2.6", optional = true }
toml = "1.1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
unicode-width = "0.2"
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
zeroize = "1.9"

[features]
default = ["server-capability"]
server-capability = ["dep:axum", "dep:futures-util", "dep:subtle", "dep:tokio"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.4", default-features = false, features = [
  "iterator",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
