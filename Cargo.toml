[package]
name = "vvmux"
version = "0.4.2"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vivido-dev/vvmux"
description = "A detachable Vivid-aware terminal multiplexer"

[workspace]
members = [".", "vvmux-plugin-api", "vvmux-plugin-sdk"]
resolver = "2"

[lib]
name = "vvmux_terminal"
path = "vvmux-terminal/src/lib.rs"

[dependencies]
axum = { version = "0.8.4", features = ["ws"], optional = true }
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
url = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
futures-util = { version = "0.3", optional = true }
log = "0.4"
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-case",
  "unicode-perl",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
semver = { version = "1", features = ["serde"] }
subtle = { version = "2.6", optional = true }
ed25519-dalek = { version = "2", features = [
  "signature",
  "digest",
  "std",
  "zeroize",
], optional = true }
httpdate = { version = "1", optional = true }
rpassword = { version = "7", optional = true }
tokio-tungstenite = { version = "0.30", features = [
  "rustls-tls-native-roots",
], optional = true }
wtransport = { version = "0.7.1", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
toml = "1.1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
unicode-width = "0.2"
vivid_gateway = { version = "1.5", path = "../vivid_gateway" }
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
zeroize = { version = "1.9", features = ["serde"] }
vvmux-plugin-api = { version = "0.4", path = "vvmux-plugin-api" }
# 38.0.4 was the original design pin but now has applicable RustSec sandbox/WASI advisories.
# 36.0.13 is the fully patched maintenance line that still supports this workspace's Rust 1.88.
wasmtime = { version = "=36.0.13", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
wasmtime-wasi = { version = "=36.0.13", default-features = false }

[features]
default = ["server-capability"]
server-capability = [
  "dep:axum",
  "dep:ed25519-dalek",
  "dep:futures-util",
  "dep:httpdate",
  "dep:rpassword",
  "dep:subtle",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:wtransport",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.4", default-features = false, features = [
  "iterator",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
wat = "1"
tokio-rustls = "0.26"
tokio-tungstenite = "0.30"
# The gateway's test-support API (wait_for_retained_media) is gated behind its testing feature.
vivid_gateway = { version = "1.5", path = "../vivid_gateway", features = [
  "testing",
] }
