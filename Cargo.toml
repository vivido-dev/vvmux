[package]
name = "vvmux"
version = "0.1.0"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wensheng/vvmux"
description = "A detachable Vivid-aware terminal multiplexer"

[workspace]
members = [".", "vvmux-terminal"]
resolver = "2"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
vivid_protocol = { version = "1.2.1", path = "../vivid_protocol" }
vvmux-terminal = { path = "vvmux-terminal" }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
