manifest_version = 2

[plugin]
id = "dev.vivido.agent.opencode"
name = "OpenCode Agent Support"
version = "2026.6.10"
min_vvmux_version = "0.4.0"
description = "Bundled passive state detection for OpenCode"
platforms = ["linux", "macos", "windows"]
permissions = []

[[agents]]
id = "opencode"
name = "OpenCode"
process = { executables = ["opencode", "opencode2", "open-code"], argv_contains = ["opencode-ai/bin/opencode"] }
launch = { executable = "opencode" }

[[agents.rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[agents.rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[agents.rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
regex = ['(■|⬝){4,}']
