[package]
name = "vvmux-plugin-sdk"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
# Matches the `vvmux-plugin-api` dependency, which requires Rust 1.95.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Rust SDK helpers for vvmux plugins"
keywords = ["vvmux", "plugin", "terminal", "multiplexer"]
categories = ["api-bindings", "command-line-utilities"]
readme = "README.md"

[dependencies]
serde_json.workspace = true
vvmux-plugin-api.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lints]
workspace = true
