[general]
prefix = "C-b"
# shell = "/bin/zsh"
# default_cwd = "/home/me"
# Name under ~/.config/vvmux/layouts (the .toml suffix is optional), or a path.
# default_layout = "dev"
scrollback_lines = 10000
status_visible = true
mouse = true
render_interval_ms = 16

# Deprecated: superseded by [theme], which accepts the same colors plus truecolor.
# Still honored, and still overrides a [theme].preset, but prefer [theme] in new configs.
# [appearance]
# active_frame = 12
# inactive_frame = 8
# status_foreground = 15
# status_background = 4

[theme]
# Every color is a string in one of four forms:
#   "default"        the terminal's own default
#   "0" ... "255"    a palette index
#   "bright-blue"    any of the 16 ANSI names (black, red, ..., bright-white)
#   "#rrggbb"        truecolor, also accepted as "#rgb"
#
# A preset supplies every color; the keys below override individual ones.
# Presets: default, mono, nord, solarized-dark, gruvbox-dark
# preset = "nord"

active_frame = "bright-blue"
inactive_frame = "bright-black"
# Titles default to their frame color.
# active_title = "bright-white"
# inactive_title = "bright-black"
# frame_background = "default"
# What an opaque pane paints where its cells would otherwise inherit the outer terminal's
# background. Only panes made opaque consult this; see [panes].
# pane_background = "black"
status_foreground = "bright-white"
status_background = "blue"
# Search matches are recolored in place; text, wide glyphs, and links are preserved.
# search_match_foreground = "black"
# search_match_background = "bright-yellow"
# search_current_foreground = "bright-white"
# search_current_background = "magenta"
# Underline color for OSC 8 links. Only the underline is colored: the text color belongs to the
# program that printed it, so a link inside already-colored output keeps its own color.
# hyperlink = "bright-blue"
# Status-row indicator color for synchronized input; frame titles use their normal title color.
# Legacy compatibility key; the tabs-only status row has no separate sync segment.
# sync_indicator = "bright-cyan"
# The status bar paints its background across the full width. Set false for the
# older look, where the background stopped where the text did.
# status_fill = true

[panes]
# Whether a new pane leaves its background to the outer terminal. Transparent panes emit SGR 49,
# so a translucent host window shows the desktop through them; an opaque pane paints
# [theme].pane_background instead and reads as a solid panel. Toggle a single pane at runtime with
# the `toggle-pane-transparency` action.
# transparent = true

[media]
aggregate_retained_bytes = 268435456
max_sources = 64
max_nodes = 256
max_anchors = 256
ipc_queue_bytes = 33554432

[floating]
default_width_percent = 60
default_height_percent = 60
border_drag_margin = 1

[hyperlinks]
# OSC 8 links printed by programs in a pane. vvmux tracks the pointer itself, so hovering marks a
# link and shows its target in the status row without needing a modifier.
enabled = true
# Underline every link, not only the hovered one, so links can be found without sweeping the mouse.
persistent_style = true
# Who opens a clicked link.
#   "delegate" — vvmux opens nothing. The outer terminal activates the link (Shift+click in Vivido),
#                so it opens on the machine you are sitting at. Correct when vvmux is the far end of
#                an ssh session.
#   "local"    — a plain click opens the link on the host running the vvmux *server*, which for a
#                remote session is not the machine in front of you. Only http, https, mailto, and
#                irc links are handed to the opener; anything else is refused, because an OSC 8 URI
#                is written by whatever program holds the pane.
open = "delegate"

[clipboard]
# What a program running in a pane may do with your clipboard through OSC 52. A store lands in the
# same copy buffer as a mouse selection and is mirrored to the outer terminal; a query is answered
# on the requesting pane's own PTY. Either direction is honored only for the focused pane of an
# attached session, so a background pane cannot overwrite or read the buffer behind your back.
#   "disabled"   — OSC 52 is ignored in both directions.
#   "only_copy"  — a pane may write the clipboard but not read it. The default, because vvmux is
#                  frequently the far end of an ssh session: answering a read would let any pane,
#                  including a remote shell, copy your clipboard off the machine you are at.
#   "only_paste" — a pane may read the clipboard but not write it.
#   "copy_paste" — both directions. Enable only where every pane is as trusted as you are.
osc52 = "only_copy"

[notifications]
# Desktop notification when a background agent needs you or finishes, so you do not have to watch
# every pane. The session decides whether to notify; the attached client renders it into your real
# terminal (OSC 9, or OSC 99 on kitty). A terminal vvmux does not recognize gets no escape rather
# than a stray one printed into your session, and a browser attach gets none at all.
enabled = true
# Which transitions interrupt you. "done" is only ever derived when the pane was not visible, so
# neither default fires for an agent you are already watching.
on = ["blocked", "done"]
# Per-pane floor, so a flapping agent cannot spam your desktop.
min_interval_ms = 2000
# Optional audible cue, run by the client, detached, with no stdio. Because the client owns it, a
# live config reload reports `notifications.sound_command` as deferred until you reattach.
# sound_command = ["afplay", "/System/Library/Sounds/Glass.aiff"]

[session]
# Persist this session's shape and restore it when the server starts again. On by default: a
# multiplexer whose panes vanish on a reboot or an upgrade has lost the thing it exists to provide.
# Turning it off also discards the snapshot already on disk, so opting out leaves nothing behind.
# The file lives under $XDG_STATE_HOME/vvmux, owner-only, and is never added to a debug bundle.
# Commands are not recorded, so a restored pane is a plain shell in its saved directory.
auto_snapshot = true

# Also persist what was on each pane's screen and restore it as scrollback. Off by default, and that
# is a privacy decision rather than a performance one: pane output is whatever scrolled past, which
# includes tokens, keys, and command output. Enabling it writes that to an owner-only file. Text and
# style only -- hyperlinks, graphics, and anchors are dropped -- and restored lines are placed
# directly rather than replayed through the terminal parser, so nothing acts a second time. Turning
# it off discards the file.
pane_history = false

# Reopen each restored agent pane's conversation with the agent's own resume command, using the
# session identity its integration reported. Fires when a client attaches, never at server start: a
# full-screen agent launched against the placeholder geometry would lay itself out for a window
# nobody is looking at. Only the integration that owns an agent kind may supply the identity a
# resume is built from. Off means agent panes restore as plain shells.
resume_agents = true

[plugins]
# Live global kill switch. Disabling stops runtimes and the registry watcher for this session.
# It also disables bundled and installed agent detection. Toggle individual bundled providers with
# `vvmux plugin enable|disable dev.vivido.agent.NAME`.
enabled = true

[server]
listen = "127.0.0.1:7880"
# Browser WebSocket origins are matched exactly; at least one is required by `vvmux serve`.
allowed_origins = ["http://127.0.0.1:3000"]
# auth_file = "/home/me/.config/vvmux/server-auth.json"
max_connections = 32
outbound_queue_bytes = 4194304

[keys.prefix]
a = "agent-navigator"
h = "focus-left"
j = "focus-down"
k = "focus-up"
l = "focus-right"
w = "tab-navigator"
"," = "rename-tab"
x = "confirm-close-pane"
s = "save-layout"
S = "toggle-sync-input"
f = "new-floating-pane"
F = "toggle-floating-panes"
P = "toggle-pane-pinned"
t = "toggle-pane-transparency"
m = "enter-floating-move-mode"
r = "enter-floating-resize-mode"

[keys.copy]
PageUp = "page-up"
"/" = "search-forward"
"?" = "search-backward"
n = "search-next"
N = "search-previous"
