[general]
prefix = "C-b"
# shell = "/bin/zsh"
# default_cwd = "/home/me"
# Name under ~/.config/vvmux/layouts (the .toml suffix is optional), or a path.
# default_layout = "dev"
scrollback_lines = 10000
status_visible = true
mouse = true
render_interval_ms = 16

# Deprecated: superseded by [theme], which accepts the same colors plus truecolor.
# Still honored, and still overrides a [theme].preset, but prefer [theme] in new configs.
# [appearance]
# active_frame = 12
# inactive_frame = 8
# status_foreground = 15
# status_background = 4

[theme]
# Every color is a string in one of four forms:
#   "default"        the terminal's own default
#   "0" ... "255"    a palette index
#   "bright-blue"    any of the 16 ANSI names (black, red, ..., bright-white)
#   "#rrggbb"        truecolor, also accepted as "#rgb"
#
# A preset supplies every color; the keys below override individual ones.
# Presets: default, mono, nord, solarized-dark, gruvbox-dark
# preset = "nord"

active_frame = "bright-blue"
inactive_frame = "bright-black"
# Titles default to their frame color.
# active_title = "bright-white"
# inactive_title = "bright-black"
# frame_background = "default"
status_foreground = "bright-white"
status_background = "blue"
# The status bar paints its background across the full width. Set false for the
# older look, where the background stopped where the text did.
# status_fill = true

[media]
aggregate_retained_bytes = 268435456
max_sources = 64
max_nodes = 256
max_anchors = 256
ipc_queue_bytes = 33554432

[floating]
default_width_percent = 60
default_height_percent = 60
border_drag_margin = 1

[server]
listen = "127.0.0.1:7880"
# Browser WebSocket origins are matched exactly; at least one is required by `vvmux serve`.
allowed_origins = ["http://127.0.0.1:3000"]
# auth_file = "/home/me/.config/vvmux/server-auth.json"
max_connections = 32
outbound_queue_bytes = 4194304

[keys.prefix]
f = "new-floating-pane"
F = "toggle-floating-panes"
P = "toggle-pane-pinned"
m = "enter-floating-move-mode"
r = "enter-floating-resize-mode"

[keys.copy]
PageUp = "page-up"
