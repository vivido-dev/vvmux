[package]
name = "vvmux-plugin-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Stable public contracts for vvmux plugins"

[dependencies]
jsonschema = { version = "0.33", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
