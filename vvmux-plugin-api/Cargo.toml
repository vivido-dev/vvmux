[package]
name = "vvmux-plugin-api"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/vivido-dev/vvmux"
description = "Stable public contracts for vvmux plugins"

[dependencies]
jsonschema = { version = "0.33", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
